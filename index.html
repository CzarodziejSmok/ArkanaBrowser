<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Claude Browser</title>
<style>
:root{--bg:#16120f;--panel:#211b17;--panel2:#2c241f;--line:#3a2f28;--fg:#f5ede3;--mut:#a39587;--acc:#e8825a;--acc2:#f2b36b;--accrgb:232,130,90}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);overflow:hidden}
body{display:flex;flex-direction:column}
.serif{font-family:Georgia,"Times New Roman",serif}
#bar{height:46px;flex:none;display:flex;align-items:center;gap:4px;padding:0 0 0 12px;background:var(--panel);-webkit-app-region:drag}
#bar button,#bar input,#wc{-webkit-app-region:no-drag}
#bar button{background:none;border:0;color:var(--mut);font-size:17px;width:32px;height:32px;border-radius:50%;cursor:pointer;transition:.15s}
#bar button:hover{background:var(--panel2);color:var(--fg)}
#bar button.on{color:var(--acc)}
#url{flex:1;margin:0 8px;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:7px 16px;font-size:14px;outline:none;transition:.15s}
#url:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(var(--accrgb),.18)}

#tabrow{height:38px;flex:none;display:flex;align-items:flex-end;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#tabs{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;gap:2px;overflow:hidden}
.tab{position:relative;flex:1 1 0;min-width:30px;max-width:200px;height:32px;display:flex;align-items:center;gap:7px;padding:0 6px 0 11px;border-radius:9px 9px 0 0;color:var(--mut);cursor:pointer;overflow:hidden;transition:background .15s}
.tab:hover{background:var(--panel2)}
.tab.on{background:var(--bg);color:var(--fg);box-shadow:inset 0 2px 0 var(--acc);min-width:96px}
.tab img,.tab i{width:14px;height:14px;font-style:normal;font-size:12px;color:var(--acc);flex:none;text-align:center}
.tab span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.tab b{flex:none;width:18px;height:18px;line-height:17px;text-align:center;border-radius:50%;font-weight:400;opacity:.6}
.tab b:hover{background:var(--line);opacity:1}
#tabs.sm .tab:not(.on) b{display:none}
#tabs.sm .tab:not(.on):hover b{display:block}
#tabs.xs .tab:not(.on){padding:0;justify-content:center}
#tabs.xs .tab:not(.on) span,#tabs.xs .tab:not(.on) b{display:none}
#nt{flex:none;background:none;border:0;color:var(--mut);font-size:18px;width:30px;height:30px;margin:0 0 1px 4px;border-radius:50%;cursor:pointer}
#nt:hover{background:var(--panel2);color:var(--fg)}
#main{flex:1;display:flex;min-height:0}
#sidewrap{width:52px;flex:none;position:relative;z-index:20}
#side{position:absolute;top:0;bottom:0;left:0;width:52px;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:3px;overflow:clip;transition:width .28s cubic-bezier(.4,0,.2,1) .2s,box-shadow .28s .2s}
#sidewrap:hover #side,#sidewrap.pin #side{width:184px;box-shadow:8px 0 28px rgba(0,0,0,.45);transition-delay:.04s}
#side h6{margin:0 6px 6px;font-size:10px;letter-spacing:.14em;color:var(--mut);font-weight:600;min-width:140px;height:12px;opacity:0;transition:opacity .2s}
#sidewrap:hover h6,#sidewrap.pin h6{opacity:1}
.fd,#nf{display:flex;align-items:center;position:relative;gap:8px;min-width:166px;padding:8px;border-radius:10px;color:var(--mut);cursor:pointer;transition:background .15s,color .15s}
.fd:hover,#nf:hover{background:var(--panel2);color:var(--fg)}
.fd.on{background:linear-gradient(90deg,rgba(var(--accrgb),.25),rgba(var(--accrgb),.06));color:var(--fg);box-shadow:inset 2px 0 0 var(--acc)}
.ic{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:17px;line-height:20px}
.ic svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fd span,#nf span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:0;transition:opacity .18s}
#sidewrap:hover .fd span,#sidewrap:hover #nf span,#sidewrap.pin .fd span,#sidewrap.pin #nf span{opacity:1;transition-delay:.12s}
.ems{position:absolute;right:4px;top:50%;transform:translateY(-50%);display:flex;gap:1px;padding:1px;border-radius:8px;background:var(--panel2);opacity:0;pointer-events:none;transition:opacity .15s}
.fd:hover .ems{opacity:1;pointer-events:auto}
.ems em{font-style:normal;font-size:13px;padding:2px 5px;border-radius:6px;color:var(--mut)}
.ems em:hover{background:var(--line);color:var(--fg)}
.fi{background:var(--bg);border:1px solid var(--acc);color:var(--fg);border-radius:8px;padding:7px 9px;font:inherit;outline:none;width:166px;flex:none}
#nf{border:1px dashed var(--line);margin-top:6px}
#nf:hover{color:var(--acc);border-color:var(--acc)}
#pk{position:fixed;left:192px;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(6,34px);gap:4px;box-shadow:0 12px 36px rgba(0,0,0,.55)}
#pk button{height:34px;border:0;border-radius:8px;background:none;font-size:18px;cursor:pointer}
#pk button:hover{background:var(--panel2)}
#pk input{grid-column:1/-1;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 9px;outline:none;font:inherit;margin-top:2px}
#pk input:focus{border-color:var(--acc)}
#left{flex:1;position:relative;min-width:0;background:var(--bg)}
#left webview{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#right{display:flex;flex-direction:column;width:0;opacity:0;overflow:hidden;background:var(--bg);transition:width .32s cubic-bezier(.4,0,.2,1),opacity .25s ease}
#right.open{width:var(--pw,430px);opacity:1}
#right>*{min-width:var(--pw,430px)}
#right webview{flex:1;border:0}
#ph{height:34px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
#ph b{color:var(--acc2);letter-spacing:.12em;font-size:11px}#ph span{flex:1}
#ph button{background:none;border:0;color:var(--mut);cursor:pointer;font-size:16px}#ph button:hover{color:var(--fg)}
#split{width:0;overflow:hidden;cursor:col-resize;background:var(--line);flex:none;transition:width .32s cubic-bezier(.4,0,.2,1),background .15s}
#split.open{width:6px}
body.dragging #right,body.dragging #split{transition:none}
#split:hover,#split.drag{background:var(--acc)}
body.dragging webview{pointer-events:none}
#home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;z-index:5;background:var(--bg);overflow:hidden}
#home>.fxl{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#bgimg{background-repeat:no-repeat;background-position:center;background-size:cover}
#home>*:not(.fxl){position:relative;z-index:1}
#logo{font-size:62px;letter-spacing:-.02em;line-height:1}#logo span{color:var(--acc)}
#tag{color:var(--mut);margin-top:-8px}
#hs{width:min(640px,92%);background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);color:var(--fg);border-radius:30px;padding:16px 26px;font-size:17px;outline:none;transition:.2s}
#hs:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(var(--accrgb),.18),0 10px 40px rgba(0,0,0,.4)}
#tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tile{width:92px;padding:14px 6px;border-radius:16px;background:color-mix(in srgb,var(--panel) 85%,transparent);border:1px solid var(--line);text-align:center;cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-3px);border-color:var(--acc)}
.tile i{display:block;font-style:normal;font-size:24px;margin-bottom:6px}.tile small{color:var(--mut)}
#set{position:fixed;top:46px;right:0;bottom:0;width:340px;z-index:100;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px 24px;overflow-y:auto;transform:translateX(105%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-12px 0 36px rgba(0,0,0,.45)}
#set.open{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.sh button{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
#set h5{margin:18px 0 8px;font-size:10px;letter-spacing:.14em;color:var(--acc2)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid var(--line);transition:.15s}
.sw i:hover{transform:scale(1.15);border-color:var(--fg)}
.br{display:flex;gap:8px;flex-wrap:wrap}
.br button,#hx,#ahx,#set select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer;outline:none}
.br button:hover,#hx:focus,#ahx:focus{border-color:var(--acc)}
#hx{width:100px;margin-top:8px;cursor:text}
#sst{margin-top:10px;font-size:12px;color:var(--mut);word-break:break-all}
.sr{display:block;margin-top:14px;font-size:12px;color:var(--mut)}
.sr>span{display:flex;justify-content:space-between;margin-bottom:6px}
.sr b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.rg{--g:linear-gradient(90deg,rgba(var(--accrgb),.25),var(--acc2));--v:0;position:relative;height:26px}
.rg[data-k=r]{--g:linear-gradient(90deg,#1c0a0a,#ff4a4a)}
.rg[data-k=g]{--g:linear-gradient(90deg,#0a1c0e,#4ae070)}
.rg[data-k=b]{--g:linear-gradient(90deg,#0a1020,#4a80ff)}
.rg .tr,.rg .fl,.rg .mf{position:absolute;left:12px;right:12px;top:4px;height:18px;border-radius:9px}
.rg .tr{background:var(--g);opacity:.32;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.rg .fl{background:var(--g);clip-path:inset(0 calc(100% - var(--v)*1%) 0 0 round 9px);animation:pls 2.4s ease-in-out infinite}
.rg .mf{right:auto;width:calc(100% - 24px);pointer-events:none}
@keyframes pls{0%,100%{filter:saturate(1.4) brightness(1.15)}50%{filter:saturate(2.1) brightness(1.55)}}
.rg input{position:absolute;inset:0;width:100%;height:26px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;outline:none}
.rg input::-webkit-slider-runnable-track{height:26px;background:transparent}
.rg input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:1px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--acc2) 45%,var(--acc) 100%);border:3px solid var(--panel);box-shadow:0 0 0 2px rgba(var(--accrgb),.7),0 0 14px rgba(var(--accrgb),.55),0 2px 8px rgba(0,0,0,.5);transition:transform .12s}
.rg input:hover::-webkit-slider-thumb,.rg input:active::-webkit-slider-thumb{transform:scale(1.14)}
.ck{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:13px;cursor:pointer;user-select:none}
.ck input{display:none}
.tg{position:relative;width:42px;height:24px;border-radius:12px;background:var(--bg);border:1px solid var(--line);flex:none;transition:.25s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:.25s cubic-bezier(.4,0,.2,1)}
.ck input:checked+.tg{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent;box-shadow:0 0 14px rgba(var(--accrgb),.5)}
.ck input:checked+.tg::after{left:20px;background:#fff}
.hint{margin:8px 0 0;font-size:11px;color:var(--mut);line-height:1.5}
#md{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
#md.open{opacity:1;pointer-events:auto}
#md .card{width:min(380px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(var(--accrgb),.15);transform:translateY(10px) scale(.97);transition:transform .22s cubic-bezier(.2,.9,.3,1.2)}
#md.open .card{transform:none}
#md h3{margin:0 0 8px;font:600 18px Georgia,serif;color:var(--fg)}
#md p{margin:0 0 20px;color:var(--mut);line-height:1.5;font-size:13px}
#md .btns{display:flex;gap:8px;justify-content:flex-end}
#md button{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:10px;padding:8px 16px;font:inherit;cursor:pointer;transition:.15s}
#md button:hover{border-color:var(--acc)}
#md button.ok{background:linear-gradient(90deg,var(--acc),var(--acc2));border-color:transparent;color:#1a110c;font-weight:600}
.ad{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1),opacity .3s ease,visibility 0s .4s}
.ad.open{grid-template-rows:1fr;opacity:1;visibility:visible;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1),opacity .35s ease .05s,visibility 0s}
.adi{overflow:hidden;min-height:0;margin:0 -6px;padding:0 6px}
#fl{flex:1;min-height:0;display:flex;flex-direction:column;gap:3px;overflow:hidden auto}
#fl::-webkit-scrollbar{width:0}
#sb{position:relative;flex:none;display:flex;flex-direction:column;gap:3px;padding-top:9px;margin-top:6px}
#sb::before{content:"";position:absolute;top:0;left:4px;right:4px;height:1px;background:linear-gradient(90deg,transparent,var(--line) 22%,var(--line) 78%,transparent)}
@keyframes tin{from{max-width:0;min-width:0;opacity:0;padding-left:0;padding-right:0;transform:scale(.7)}to{max-width:200px;opacity:1;transform:none}}
@keyframes tout{to{max-width:0;min-width:0;opacity:0;padding-left:0;padding-right:0;transform:scale(.7)}}
.tab.ent,.pt.ent{animation:tin .26s cubic-bezier(.2,.8,.3,1) both}
.tab.out,.pt.out{animation:tout .2s ease forwards;pointer-events:none}
@keyframes fin{from{max-height:0;opacity:0;padding-top:0;padding-bottom:0;transform:translateX(-14px)}to{max-height:44px;opacity:1;transform:none}}
@keyframes fout{to{max-height:0;opacity:0;padding-top:0;padding-bottom:0;transform:translateX(-14px)}}
.fd.ent{animation:fin .28s cubic-bezier(.2,.8,.3,1) both;overflow:hidden}
.fd.out{animation:fout .22s ease forwards;overflow:hidden;pointer-events:none}
#pins{display:grid;grid-template-rows:0fr;flex:none;background:var(--panel);transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
#pins.has{grid-template-rows:1fr;border-bottom:1px solid var(--line)}
#pinsi{overflow:hidden;min-height:0;display:flex;gap:6px;align-items:center;padding:0 10px;transition:padding .3s}
#pins.has #pinsi{padding:5px 10px}
.pt{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:12px;background:var(--panel2);color:var(--mut);font-size:12px;cursor:pointer;max-width:150px;border:1px solid transparent;transition:color .15s,border-color .15s}
.pt:hover{color:var(--fg);border-color:var(--line)}
.pt.on{color:var(--fg);border-color:var(--acc);background:linear-gradient(90deg,rgba(var(--accrgb),.22),rgba(var(--accrgb),.06))}
.pt img,.pt i{width:13px;height:13px;font-style:normal;font-size:11px;color:var(--acc);text-align:center;flex:none}
.pt span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
s.mu{text-decoration:none;font-size:11px;flex:none}
#cm{position:fixed;z-index:250;min-width:230px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(var(--accrgb),.1);opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top left;pointer-events:none;transition:opacity .14s,transform .16s cubic-bezier(.2,.9,.3,1.1)}
#cm.open{opacity:1;transform:none;pointer-events:auto}
.mi{display:flex;align-items:center;gap:18px;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap}
.mi:hover{background:rgba(var(--accrgb),.16)}
.mi.off{opacity:.38;pointer-events:none}
.mi>span:first-child{flex:1}
.ms{height:1px;margin:5px 6px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.mk{display:flex;gap:3px}
kbd{font:600 10px/1 "Segoe UI",system-ui,sans-serif;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:3px 5px;min-width:18px;text-align:center}
.stabs{position:relative;display:flex;margin:12px 0 4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.stabs button{flex:1;position:relative;z-index:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:8px 0;cursor:pointer;transition:color .2s}
.stabs button.on{color:var(--fg);font-weight:600}
.stabs i{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:9px;background:linear-gradient(90deg,rgba(var(--accrgb),.35),rgba(var(--accrgb),.15));box-shadow:inset 0 0 0 1px rgba(var(--accrgb),.4);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.stabs.u i{transform:translateX(100%)}
.stabs.a i{transform:translateX(200%)}
.stabs.k i{transform:translateX(300%)}
.kr{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);font-size:12px;color:var(--fg)}
.kr>span{flex:1;min-width:0}
.kcs{width:20px;flex:none}
.kb{display:flex;gap:3px;align-items:center;min-width:64px;justify-content:flex-end;padding:4px 6px;border-radius:8px;cursor:pointer;border:1px dashed transparent;transition:.15s}
.kb:hover{border-color:var(--acc);background:rgba(var(--accrgb),.08)}
.kb.rec{border-color:var(--acc);color:var(--acc2);animation:pls2 1.1s ease-in-out infinite}
.kb em{font-style:normal;font-size:11px;color:var(--mut)}
.kc{width:20px;flex:none;background:none;border:0;color:var(--mut);cursor:pointer;font-size:14px;padding:0;border-radius:5px}
.kc:hover{color:var(--fg);background:var(--line)}
@keyframes pls2{50%{box-shadow:0 0 0 3px rgba(var(--accrgb),.25)}}
#brand{display:flex;align-items:center;gap:6px;position:relative;padding:0 10px 0 2px;margin-right:4px;font-size:16px;font-weight:600;color:var(--acc);white-space:nowrap;cursor:pointer;-webkit-app-region:no-drag;transition:color .3s,text-shadow .3s}
#brand::after{content:"";position:absolute;left:2px;right:10px;bottom:-3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.4,0,.2,1)}
#brand:hover{color:var(--acc2);text-shadow:0 0 14px rgba(var(--accrgb),.7)}
#brand:hover .st{transform:rotate(180deg) scale(1.2)}
#brand:hover::after{transform:scaleX(1)}
#brand:active .st{transform:rotate(360deg) scale(.9)}
#bar button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
@keyframes flyl{0%{transform:translateX(0);opacity:1}40%{transform:translateX(-10px);opacity:0}41%{transform:translateX(10px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes flyr{0%{transform:translateX(0);opacity:1}40%{transform:translateX(10px);opacity:0}41%{transform:translateX(-10px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes rot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
#back:hover svg{animation:flyl .55s ease}
#fwd:hover svg{animation:flyr .55s ease}
#reload:hover svg{animation:rot .9s cubic-bezier(.12,.8,.25,1)}
#wc{display:flex;align-self:stretch;margin-left:6px}
#wc button{width:50px;height:100%;border-radius:0;background:none;color:var(--mut);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
#bar #wc button svg{width:22px;height:22px;stroke-width:1.8}
#wc button:hover{background:rgba(var(--accrgb),.16);color:var(--fg)}
#wc #wcls:hover{background:#e5534b;color:#fff}
@keyframes gspin{to{transform:rotate(360deg)}}
@keyframes tdown{to{transform:translateY(115%);opacity:0}}
@keyframes trise{from{transform:translateY(115%);opacity:0}to{transform:none;opacity:1}}
.tab.sdn,.pt.sdn{animation:tdown .19s cubic-bezier(.5,0,.9,.6) forwards;pointer-events:none}
.tab.rise,.pt.rise{animation:trise .3s cubic-bezier(.2,.8,.3,1) both}
#bar button{position:relative}
#brand .st{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#bar button svg{overflow:visible}
.t1,.t2,.cm{opacity:0;fill:currentColor;stroke:none}
#gear:hover .ic,#toggle:hover .ic{color:var(--acc2)}
#gear:hover .ic svg{animation:gspin 1.4s linear infinite}
#toggle:hover .ic svg{animation:spark 1.1s ease-in-out infinite;filter:drop-shadow(0 0 4px rgba(var(--accrgb),.8))}

const cv=$('bg'), cx=cv.getContext('2d'); let W=0,H=0,last=0;
new ResizeObserver(()=>{ const w=cv.clientWidth, h=cv.clientHeight; if(w===W&&h===H) return; W=cv.width=w; H=cv.height=h; draw(performance.now()); }).observe(cv);  // po zmianie rozmiaru płótno jest czyszczone, więc rysujemy od razu
const rnd=Math.random;
const DUST=Array.from({length:140},(_,i)=>({x:rnd(),y:rnd(),r:1+rnd()*2.6,v:.00005+rnd()*.00011,p:rnd()*6.28,c:i%3}));
const STARS=Array.from({length:120},()=>({x:rnd(),y:rnd(),r:.5+rnd()*1.1,p:rnd()*6.28,sp:.4+rnd()*1.2}));
const RAIN=Array.from({length:90},()=>({x:rnd(),y:rnd(),l:.03+rnd()*.05,v:.0003+rnd()*.0005}));
const fxv=k=>S.settings.fx[k]/100*S.settings.fx.all/100;
// sprite'y poświat (jedna tekstura na kolor zamiast gradientu na cząstkę i klatkę)
const GSP=new Map();
function glowSp(c,n){ const k=c+'|'+n; let s=GSP.get(k); if(!s){ if(GSP.size>40) GSP.clear(); s=document.createElement('canvas'); s.width=s.height=n; const x=s.getContext('2d'), m=n/2, g=x.createRadialGradient(m,m,0,m,m,m); g.addColorStop(0,`rgba(${c},1)`); g.addColorStop(1,`rgba(${c},0)`); x.fillStyle=g; x.fillRect(0,0,n,n); GSP.set(k,s); } return s; }
let bgIdle=false, bgLast=0;
function frame(t){ requestAnimationFrame(frame); if(t-bgLast<28) return; bgLast=t; draw(t); }   // ~30 kl./s wystarcza dla powolnych efektów
function draw(t){
  const dt=Math.min(50,(t-last)||16); last=t;
  if(home.style.display==='none'||!W) return;
  const fa=fxv('aurora'), fw=fxv('waves'), fs=fxv('stars'), fr=fxv('rain'), fd=fxv('dust');
  if(!(fa>0||fw>0||fs>0||fr>0||fd>0)){ if(!bgIdle){ cx.clearRect(0,0,W,H); bgIdle=true; } return; }   // bez efektów nic nie rysujemy
  bgIdle=false; cx.clearRect(0,0,W,H);
  const C=[accRgb,acc2Rgb,fgRgb]; let a=fa;
  if(a>0){ for(let k=0;k<3;k++){ const x=W*(.2+.3*k+.1*Math.sin(t*.00018+k*2)), y=H*(.22+.12*Math.cos(t*.00013+k*1.7)), g=cx.createRadialGradient(x,y,0,x,y,W*.42); g.addColorStop(0,`rgba(${C[k]},${.28*a})`); g.addColorStop(1,`rgba(${C[k]},0)`); cx.fillStyle=g; cx.fillRect(0,0,W,H); }
    // miękkie zanikanie przy bocznych krawędziach: poświata nie jest już ucinana na styku z paskiem
    const ew=Math.round(W*.16); cx.globalCompositeOperation='destination-out';
    let ge=cx.createLinearGradient(0,0,ew,0); ge.addColorStop(0,'rgba(0,0,0,1)'); ge.addColorStop(.5,'rgba(0,0,0,.3)'); ge.addColorStop(1,'rgba(0,0,0,0)'); cx.fillStyle=ge; cx.fillRect(0,0,ew,H);
    ge=cx.createLinearGradient(W-ew,0,W,0); ge.addColorStop(0,'rgba(0,0,0,0)'); ge.addColorStop(.5,'rgba(0,0,0,.3)'); ge.addColorStop(1,'rgba(0,0,0,1)'); cx.fillStyle=ge; cx.fillRect(W-ew,0,ew,H);
    cx.globalCompositeOperation='source-over'; }
  a=fw;
  if(a>0) for(let k=0;k<3;k++){ cx.beginPath(); cx.moveTo(0,H); for(let x=0;x<=W;x+=10) cx.lineTo(x,H*(.80+.055*k)+Math.sin(x*.0042+t*.00035*(1+k*.35)+k*2.1)*(10+14*a+k*5)); cx.lineTo(W,H); cx.closePath(); cx.fillStyle=`rgba(${accRgb},${(.05-k*.012)*(.3+1.4*a)})`; cx.fill(); }
  a=fs;
  if(a>0){ const n=Math.ceil(STARS.length*Math.min(1,a*1.2)); for(let i=0;i<n;i++){ const q=STARS[i]; cx.fillStyle=`rgba(${fgRgb},${a*(.15+.85*Math.abs(Math.sin(t*.001*q.sp+q.p)))})`; cx.beginPath(); cx.arc(q.x*W,q.y*H,q.r,0,6.283); cx.fill(); } }
  a=fr;
  if(a>0){ cx.lineWidth=1; cx.strokeStyle=`rgba(${acc2Rgb},${.3*a})`; const n=Math.ceil(RAIN.length*Math.min(1,a*1.2)); cx.beginPath(); for(let i=0;i<n;i++){ const d=RAIN[i]; d.y+=d.v*dt; if(d.y>1.05){ d.y=-.1; d.x=rnd(); } cx.moveTo(d.x*W,d.y*H); cx.lineTo(d.x*W,(d.y+d.l)*H); } cx.stroke(); }   // jedna ścieżka = jedno rysowanie
  a=fd;
  if(a>0){ const n=Math.ceil(DUST.length*Math.min(1,a*1.2)), sp=C.map(c=>glowSp(c,64)), ma=Math.min(1,.4+a); for(let i=0;i<n;i++){ const d=DUST[i]; d.y-=d.v*dt; if(d.y<-.02){ d.y=1.02; d.x=rnd(); }
    const x=(d.x+Math.sin(t*.0003+d.p)*.015)*W, y=d.y*H, R=d.r*5; cx.globalAlpha=(.25+.4*Math.abs(Math.sin(t*.001+d.p)))*ma; cx.drawImage(sp[d.c],x-R,y-R,2*R,2*R); } cx.globalAlpha=1; }
}

function ask(title,text,ok='OK'){ return new Promise(res=>{
  const m=$('md'); m.querySelector('h3').textContent=title; m.querySelector('p').textContent=text; $('mo').textContent=ok; m.classList.add('open'); $('mo').focus();
  const kd=e=>{ if(e.key==='Escape'){ e.stopPropagation(); done(false); } else if(e.key==='Enter'&&document.activeElement!==$('mc')){ e.preventDefault(); done(true); } };
  const bd=e=>{ if(e.target===m) done(false); };
  const done=v=>{ m.classList.remove('open'); document.removeEventListener('keydown',kd,true); m.removeEventListener('mousedown',bd); res(v); };
  document.addEventListener('keydown',kd,true); m.addEventListener('mousedown',bd); $('mo').onclick=()=>done(true); $('mc').onclick=()=>done(false);
}); }

const hh=i=>{ const x=Math.sin(i*12.9898)*43758.5453; return x-Math.floor(x); };
function drawMini(g,fx,w,h,v,t){
  const A=accRgb, B=acc2Rgb, F=fgRgb;
  const dust=()=>{ const n=4+Math.round(v*w/10); for(let i=0;i<n;i++){ const x=hh(i+1)*w, y=h+3-((t*.012*(.5+hh(i+2))+hh(i+3)*h*3)%(h+6)), r=(1+hh(i+4)*1.6)*2.6, al=(.35+.55*hh(i+5))*(.4+.6*v), c=i%2?B:F, gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${c},${al})`); gr.addColorStop(1,`rgba(${c},0)`); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,6.283); g.fill(); } };
  const waves=()=>{ for(let k=0;k<2;k++){ g.beginPath(); g.moveTo(0,h); for(let x=0;x<=w;x+=4) g.lineTo(x,h*(.62+.14*k)+Math.sin(x*.07+t*.003*(1+k*.4)+k*2)*h*(.1+.22*v)); g.lineTo(w,h); g.closePath(); g.fillStyle=`rgba(${k?B:A},${.3+.3*v})`; g.fill(); } };
  const stars=()=>{ const n=3+Math.round(v*w/8); for(let i=0;i<n;i++){ g.fillStyle=`rgba(${F},${(.2+.8*Math.abs(Math.sin(t*.003*(.5+hh(i+3))+i)))*(.4+.6*v)})`; g.beginPath(); g.arc(hh(i)*w,hh(i+9)*h,.7+hh(i+2)*.6,0,6.283); g.fill(); } };
  const aurora=()=>{ for(let k=0;k<3;k++){ const x=w*(.15+.3*k+.12*Math.sin(t*.0008+k*2)), c=[A,B,F][k], gr=g.createRadialGradient(x,h/2,0,x,h/2,h*2.2); gr.addColorStop(0,`rgba(${c},${.3+.45*v})`); gr.addColorStop(1,`rgba(${c},0)`); g.fillStyle=gr; g.fillRect(0,0,w,h); } };
  const rain=()=>{ const n=3+Math.round(v*w/9); g.lineWidth=1; g.strokeStyle=`rgba(${B},${.4+.5*v})`; for(let i=0;i<n;i++){ const x=hh(i)*w, y=((t*.05*(.6+hh(i+1))+hh(i+2)*h*3)%(h+8))-4; g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+5); g.stroke(); } };
  ({dust,waves,stars,aurora,rain,all:()=>{ aurora(); waves(); dust(); }})[fx]();
}

function calcEval(src,deg){
  const s=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/\s+/g,'');
  let i=0; const bad=()=>{ throw new Error('x'); };
  const rad=x=>deg?x*Math.PI/180:x, back=x=>deg?x*180/Math.PI:x;
  const F={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>Math.tan(rad(x)),asin:x=>back(Math.asin(x)),acos:x=>back(Math.acos(x)),atan:x=>back(Math.atan(x)),ln:Math.log,log:Math.log10,sqrt:Math.sqrt,abs:Math.abs,exp:Math.exp};
  const FK=Object.keys(F).sort((a,b)=>b.length-a.length);
  const fact=n=>{ if(n<0||n!==Math.floor(n)||n>170) bad(); let r=1; for(let k=2;k<=n;k++) r*=k; return r; };
  function expr(){ let v=term(); while(s[i]==='+'||s[i]==='-'){ const o=s[i++], r=term(); v=o==='+'?v+r:v-r; } return v; }
  function term(){ let v=unary(); for(;;){ const c=s[i]||''; if(c==='*'||c==='/'){ i++; const r=unary(); v=c==='*'?v*r:v/r; } else if(c==='('||/[a-z\d.]/.test(c)) v*=unary(); else break; } return v; }
  function unary(){ if(s[i]==='-'){ i++; return -unary(); } if(s[i]==='+'){ i++; return unary(); } return pow(); }
  function pow(){ let b=post(); if(s[i]==='^'){ i++; b=Math.pow(b,unary()); } return b; }
  function post(){ let v=prim(); for(;;){ if(s[i]==='!'){ i++; v=fact(v); } else if(s[i]==='%'){ i++; v=v/100; } else break; } return v; }
  function prim(){
    if(s[i]==='('){ i++; const v=expr(); if(s[i]===')') i++; return v; }
    const m=/^(\d*\.?\d+(?:e[+-]?\d+)?|\d+\.)/i.exec(s.slice(i)); if(m){ i+=m[0].length; return parseFloat(m[0]); }
    const f=/^[a-z]+/.exec(s.slice(i));
    if(f){ const nm=f[0];
      for(const k of FK) if(nm.startsWith(k)){ i+=k.length; if(s[i]!=='(') bad(); i++; const v=expr(); if(s[i]===')') i++; return F[k](v); }
      if(nm.startsWith('pi')){ i+=2; return Math.PI; } if(nm[0]==='e'){ i++; return Math.E; } }
    return bad(); }
  const v=expr(); if(i<s.length) bad(); return v;
}

const FSRC={};
function flagSrc(k){
  if(FSRC[k]) return FSRC[k]; const o={ready:false,width:1,height:1,img:new Image()}; FSRC[k]=o; let url;
  if(FLAGPNG[k]) url='data:image/png;base64,'+FLAGPNG[k];
  else { const [vw,vh,body]=FLAGSVG[k], w=960, h=Math.round(960*vh/vw); url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${vw} ${vh}">${body}</svg>`); }
  o.img.onload=()=>{ o.width=o.img.naturalWidth; o.height=o.img.naturalHeight; o.ready=true; }; o.img.src=url; return o; }
// Flaga jako tkanina: kolumny podążają za krzywą fali (długość łuku => wgłębienia „do tyłu”), perspektywa i cieniowanie z nachylenia.
// Płótno jest wyższe niż widoczne okno (28%), a flaga większa niż okno + amplituda, więc w dołach fali nie prześwituje tło.
const FCACHE=new WeakMap();
function flagScaled(cv,src,Wq,Hq){ const key=cv.dataset.f+Wq+'x'+Hq; let c=FCACHE.get(cv); if(!c||c.key!==key){ const off=document.createElement('canvas'); off.width=Wq; off.height=Hq; const g=off.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.drawImage(src.img,0,0,Wq,Hq); c={key,off}; FCACHE.set(cv,c); } return c.off; }
function drawFlag(cv,t){
  const src=flagSrc(cv.dataset.f); if(!src.ready) return; const g=cv.getContext('2d'), dpr=window.devicePixelRatio||1, cw=cv.clientWidth, ch=cv.clientHeight; if(!cw||!ch) return;
  const W=Math.round(cw*dpr), H=Math.round(ch*dpr); if(cv.width!==W) cv.width=W; if(cv.height!==H) cv.height=H; g.clearRect(0,0,W,H);
  const Hv=H/1.28, A=Hv*.075, sc=Math.max(1.16*W/src.width,(Hv+2.6*A)/src.height), Wq=Math.ceil(src.width*sc), Hq=Math.ceil(src.height*sc), off=flagScaled(cv,src,Wq,Hq), y0=H/2, slopes=new Float32Array(W+4);
  let x=0; for(let i=0;i<Wq&&x<W+2;i++){
    const p=i/Wq, ph=p*6.1-t*2.5, ph2=p*13.7-t*4.2+1.3, amp=.3+.7*p, dy=(Math.sin(ph)*A+Math.sin(ph2)*A*.2)*amp, slope=amp*A*(Math.cos(ph)*6.1+Math.cos(ph2)*13.7*.2)/Wq, len=Math.sqrt(1+slope*slope);
    const hh=Hq*(1+.045*Math.cos(ph)), top=y0+dy-hh/2, w=1/len; g.drawImage(off,i,0,1,Hq,x,top,w+.85,hh); const xi=Math.floor(x); if(xi>=0&&xi<W) slopes[xi]=slope; x+=w; }
  let last=0; for(let X=0;X<W;X++){ if(slopes[X]!==0) last=slopes[X]; else slopes[X]=last; }
  g.globalCompositeOperation='source-atop';
  for(let X=0;X<W;X++){ const sh=Math.max(-1,Math.min(1,slopes[X]*6)); if(Math.abs(sh)<.02) continue; g.fillStyle=sh>0?`rgba(0,0,0,${(sh*.42).toFixed(3)})`:`rgba(255,255,255,${(-sh*.3).toFixed(3)})`; g.fillRect(X,0,1,H); }
  g.globalCompositeOperation='source-over'; }
setInterval(()=>{ const st=$('set'); if(!st||!st.classList.contains('open')) return; const lg=$('lg'); if(!lg) return; const open=lg.classList.contains('open'), lr=lg.querySelector('.lg-l').getBoundingClientRect(), t=performance.now()/1000;
  st.querySelectorAll('canvas.lf').forEach(c=>{ const box=c.parentElement;
    if(c.closest('.lg-l')){ if(!open) return; const r=box.getBoundingClientRect(); if(r.bottom<lr.top||r.top>lr.bottom) return; } else if(!c.offsetParent) return;
    drawFlag(c,t); }); },33);
function langPicker(cur){
  cur=LORDER.includes(cur)?cur:'pl';
  const names=c=>{ const a=langName(cur,c), b=LANGS[c]; return `<div class="lg-n"><b>${esc(a)}</b>${a!==b?`<small>${esc(b)}</small>`:''}</div>`; }, fl=c=>`<div class="lg-fl"><canvas class="lf" data-f="${c}"></canvas></div>`;
  return `<div class="lg" id="lg"><div class="lg-b" id="lgb" role="button" tabindex="0" title="Wybierz język"><div class="lg-bg"></div>${fl(cur)}${names(cur)}<em class="lg-c">▾</em></div>
    <div class="lg-l">${LORDER.map(c=>`<div class="lg-i${c===cur?' cur':''}" role="button" tabindex="0" data-lg="${c}"${c===cur?' title="Obecnie wybrany"':''}><div class="lg-bg"><span class="lg-t"${c==='he'?' dir="rtl"':''}>${c===cur?'<u class="lg-k">✓</u>':''}${esc(LSAMPLE[c])}</span></div>${fl(c)}${names(c)}</div>`).join('')}</div></div>`; }
const lgPick=e=>{
  if(e.target.closest('#lgb')){ $('lg').classList.toggle('open'); return; }
  const it=e.target.closest('.lg-i'); if(!it) return; const c=it.dataset.lg;
  if(c===S.settings.ui.lang){ $('lg').classList.remove('open'); return; }
  S.settings.ui.lang=c; save(); setTimeout(()=>location.reload(),150); };
$('set').addEventListener('click',lgPick);
$('set').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('#lgb,.lg-i')){ e.preventDefault(); lgPick(e); } });

const AFXP=Array.from({length:40},(_,i)=>({x:Math.random(),y:Math.random(),r:(1+Math.random()*1.7)*2.4,s:.012+Math.random()*.02,a:.35+Math.random()*.55,k:i%2}));
let afxL=0;
setInterval(()=>{ if(document.hidden) return; const cs=document.querySelectorAll('canvas.afx'); if(!cs.length) return; const now=performance.now(), dt=afxL?Math.min(120,now-afxL):0; afxL=now;
  const A=S.settings.afx, still=document.body.classList.contains('na-apps');
  if(!still) AFXP.forEach(p=>{ p.y-=p.s*dt/500; if(p.y<-.05){ p.y=1.05; p.x=Math.random(); } });
  const spF=glowSp(fgRgb,64), spA=glowSp(acc2Rgb,64);
  cs.forEach(cv=>{ const w=cv.closest('.aw'); if(!w) return; const W=cv.clientWidth, H=cv.clientHeight; if(!W||!H) return;
    const v=A.on?(A[w.dataset.app]??50):0, k=v/100, sig=still?W+'|'+H+'|'+k+'|'+fgRgb+'|'+acc2Rgb:null;
    if(still&&cv._sg===sig) return;   // bez ruchu nie ma czego przerysowywać
    cv._sg=sig; if(cv.width!==W) cv.width=W; if(cv.height!==H) cv.height=H;
    const g=cv.getContext('2d'); g.clearRect(0,0,W,H); if(k<=0) return;
    const n=Math.min(AFXP.length,Math.round(6+34*k)), al=.08+.4*k;

  const setGone=v=>{ dragGone=v; const it=cfg.item(); if(it) it.classList.toggle('gone',v); };
  const pos=ev=>{
    const z=cfg.zone().getBoundingClientRect(), rg=cfg.range().getBoundingClientRect();
    const dist=Math.max(z.left-ev.clientX,0,ev.clientX-z.right,z.top-ev.clientY,ev.clientY-z.bottom);
    if(mode==='bar'&&dist>44&&cfg.canDetach()){ mode='free'; setGone(true); snapUntil=performance.now()+180; }
    else if(mode==='free'&&dist<16){ mode='bar'; setGone(false); snapUntil=performance.now()+180; }
    let gx,gy;
    if(mode==='free'){ gx=ev.clientX-offX; gy=ev.clientY-offY; }
    else if(cfg.axis==='x'){ gx=clamp(ev.clientX-offX,rg.left,Math.max(rg.left,rg.right-w)); gy=z.top-5; }   // zablokowana w pionie, lekko uniesiona
    else { gx=rg.left+6; gy=clamp(ev.clientY-offY,rg.top,Math.max(rg.top,rg.bottom-h)); }
    ghost.style.transition=performance.now()<snapUntil?'left .16s,top .16s':'none'; ghost.style.left=gx+'px'; ghost.style.top=gy+'px';
    if(cfg.xmove){ if(mode==='free') cfg.xmove(ev).then(o=>{ over=!!o; if(ghost) ghost.style.visibility=o?'hidden':''; }); else if(over){ over=false; cfg.xend(); ghost.style.visibility=''; } }
    if(mode==='bar'){
      const all=[...cfg.container().querySelectorAll(cfg.sel)], others=all.filter(x=>x.dataset.id!==cfg.id), center=cfg.axis==='x'?gx+w/2:gy+h/2;
      let idx=0; others.forEach(x=>{ const r=x.getBoundingClientRect(); if((cfg.axis==='x'?r.left+r.width/2:r.top+r.height/2)<center) idx++; });
      if(idx!==all.findIndex(x=>x.dataset.id===cfg.id)) flipRun(cfg,()=>cfg.move(cfg.id,idx));
    }
  };
  const mv=ev=>{
    if(!started){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<5) return; started=true;
      ghost=el0.cloneNode(true); ghost.classList.remove('on','ent','rise','sdn','out','drg','gone'); ghost.classList.add('gh'); ghost.style.width=w+'px'; ghost.style.height=h+'px';
      document.body.appendChild(ghost); dragId=cfg.id; el0.classList.add('drg'); document.body.classList.add('dragging','dg'); if(cfg.start) cfg.start(); }
    pos(ev); };
  const finish=()=>{ removeEventListener('mousemove',mv); removeEventListener('mouseup',up); document.removeEventListener('keydown',kd,true);
    if(started){ dragId=null; dragGone=false; document.body.classList.remove('dragging','dg'); cfg.rerender(); dragSwallow=true; setTimeout(()=>{ dragSwallow=false; },150); save(); } };
  const up=ev=>{
    if(!started) return finish();
    if(mode==='free'&&cfg.canDetach()){ ghost.remove(); finish(); (cfg.drop?cfg.drop(ev):Promise.resolve(false)).then(ok=>{ if(!ok) cfg.detach(ev); }); return; }
    const it=cfg.item(), rr=it.getBoundingClientRect(), g=ghost; g.style.transition='left .16s,top .16s'; g.style.left=rr.left+'px'; g.style.top=rr.top+'px'; setTimeout(()=>g.remove(),170); finish(); };
  const kd=ev=>{ if(ev.key==='Escape'&&started){ ev.stopPropagation(); mode='bar'; if(cfg.xend) cfg.xend(); cfg.setOrder(orig); ghost.remove(); finish(); } };
  addEventListener('mousemove',mv); addEventListener('mouseup',up); document.addEventListener('keydown',kd,true);
}
function tabDrag(e,id,pinned){
  const cont=()=>pinned?$('pinsi'):$('tabs'), grp=()=>F().tabs.filter(t=>!!t.pinned===pinned);
  const setGroup=ids=>{ const f=F(), m=new Map(f.tabs.map(t=>[t.id,t])), slots=f.tabs.map((t,i)=>!!t.pinned===pinned?i:-1).filter(i=>i>=0); slots.forEach((sl,k)=>{ f.tabs[sl]=m.get(ids[k]); }); };
  startItemDrag(e,{id,axis:'x',sel:pinned?'.pt:not(.out)':'.tab:not(.out)',container:cont,zone:()=>pinned?$('pins'):$('tabrow'),range:cont,
    item:()=>cont().querySelector(`[data-id="${id}"]`),order:()=>grp().map(t=>t.id),setOrder:setGroup,
    move:(tid,idx)=>{ const ids=grp().map(t=>t.id).filter(x=>x!==tid); ids.splice(idx,0,tid); setGroup(ids); renderTabs(); },
    rerender:renderTabs,canDetach:()=>true,detach:ev=>detachTab(id,ev),
    xmove:ev=>{ try{ return window.api.xdMove({sx:ev.screenX,sy:ev.screenY,zone:dropZone(),tab:tabPayload(id)}).catch(()=>false); }catch{ return Promise.resolve(false); } },
    xend:()=>{ try{ window.api.xdEnd(); }catch{} },
    drop:async ev=>{ try{ const ok=await window.api.xdDrop({sx:ev.screenX,sy:ev.screenY,zone:dropZone(),tab:tabPayload(id)}); if(ok) closeAfterMove(id); return !!ok; }catch{ return false; } }});
}
const dropZone=()=>Math.round(Math.max($('tabrow').getBoundingClientRect().bottom,$('pins').getBoundingClientRect().bottom));   // dół paska kart (i przypiętych) względem okna
const tabPayload=id=>{ const t=F().tabs.find(x=>x.id===id); return t?{url:t.url,title:t.title,icon:t.icon,muted:t.muted}:null; };
function closeAfterMove(id){   // karta trafiła do innego okna: usuń ją tutaj, a jeśli była jedyna – zamknij to okno
  const f=F(), only=S.folders.length===1&&f.tabs.length===1; rmTab(f,id,true);
  if(only) setTimeout(()=>{ try{ window.api.winCtl('close'); }catch{} },80);
}
function xdHandle(m){    // komunikaty o karcie przeciąganej z innego okna nad to okno
  if(m.kind==='end'){ if(xd){ xd=null; renderTabs(); } return; }
  if(!m.tab||dragId!==null) return;
  if(m.kind==='over'){
    let idx=0; $('tabs').querySelectorAll('.tab:not(.xd)').forEach(x=>{ const r=x.getBoundingClientRect(); if(r.left+r.width/2<m.cx) idx++; });
    if(!xd||xd.idx!==idx||xd.tab.url!==m.tab.url) flipRun({id:'__xd',axis:'x',sel:'.tab',container:()=>$('tabs')},()=>{ xd={tab:m.tab,idx}; renderTabs(); });
  } else if(m.kind==='drop'){
    const f=F(), un=f.tabs.filter(t=>!t.pinned), idx=xd?xd.idx:un.length; xd=null;
    const nt={id:uid(),url:m.tab.url,title:m.tab.title,icon:m.tab.icon,muted:m.tab.muted}, before=un[idx];
    f.tabs.splice(before?f.tabs.indexOf(before):f.tabs.length,0,nt); entering.add(nt.id); activate(nt.id);
  }
}
function folderDrag(e,id){
  const setF=ids=>{ const m=new Map(S.folders.map(f=>[f.id,f])); S.folders=ids.map(i=>m.get(i)); };
  startItemDrag(e,{id,axis:'y',sel:'.fd[data-id]:not(.out)',container:()=>$('fl'),zone:()=>$('side'),range:()=>$('fl'),
    item:()=>$('fl').querySelector(`.fd[data-id="${id}"]`),order:()=>S.folders.map(f=>f.id),setOrder:setF,
    move:(fid,idx)=>{ const ids=S.folders.map(f=>f.id).filter(x=>x!==fid); ids.splice(idx,0,fid); setF(ids); renderSide(); },
    rerender:renderSide,canDetach:()=>S.folders.length>1,detach:ev=>detachFolder(id,ev),start:()=>$('sidewrap').classList.add('pin')});
}
function openWindow(folder,ev,ox,oy){
  const st={folders:[folder],cur:folder.id,panel:false,pw:S.pw,closed:[],settings:JSON.parse(JSON.stringify(S.settings)),aw:{open:[],pos:{},links:[],data:{}}};
  st.settings.apps.on=false;    // aplikacje (notatki, historia) zostają w oknie głównym
  try{ window.api.detach({state:st,x:ev.screenX-ox,y:ev.screenY-oy}); return true; }catch{ toast(t('Brak obsługi – podmień main.js i preload.js na nowe.')); return false; }
}
function detachTab(id,ev){
  const f=F(), tb=f.tabs.find(x=>x.id===id); if(!tb) return;
  const nt={...tb}; delete nt.pinned;
  if(openWindow({id:uid(),name:f.name,icon:f.icon||'📁',tabs:[nt],active:nt.id},ev,110,66)) rmTab(f,id,true);
}
function detachFolder(id,ev){
  if(S.folders.length<2) return; const f=S.folders.find(x=>x.id===id); if(!f) return;
  if(!openWindow(JSON.parse(JSON.stringify(f)),ev,26,150)) return;
  S.folders=S.folders.filter(x=>x.id!==id); if(S.cur===id) switchFolder(S.folders[0].id); else { renderSide(); save(); }
}
$('tabs').addEventListener('mousedown',e=>{ const el=e.target.closest('.tab'); if(!el||e.target.dataset.x||el.classList.contains('out')) return; tabDrag(e,el.dataset.id,false); });
$('pinsi').addEventListener('mousedown',e=>{ const el=e.target.closest('.pt'); if(el&&!el.classList.contains('out')) tabDrag(e,el.dataset.id,true); });
$('fl').addEventListener('mousedown',e=>{ const el=e.target.closest('.fd'); if(!el||!el.dataset.id||e.target.closest('.ems')||el.classList.contains('out')) return; folderDrag(e,el.dataset.id); });
document.addEventListener('click',e=>{ if(dragSwallow){ e.stopPropagation(); e.preventDefault(); } },true);

// ===== ZADANIE 2: ikona na pasku zadań rysowana w kolorach motywu =====
function drawIcon(){
  const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d');
  const bg=g.createLinearGradient(0,0,256,256); bg.addColorStop(0,P.panel2); bg.addColorStop(1,P.bg);
  g.fillStyle=bg; g.beginPath(); g.roundRect(8,8,240,240,58); g.fill(); g.lineWidth=5; g.strokeStyle=P.acc+'99'; g.stroke();
  g.translate(128,128); g.lineCap='round'; g.lineWidth=17; const gr=g.createLinearGradient(-80,-80,80,80); gr.addColorStop(0,P.acc); gr.addColorStop(1,P.acc2);
  g.strokeStyle=gr; g.shadowColor=P.acc; g.shadowBlur=22;
  for(let k=0;k<8;k++){ g.rotate(Math.PI/4); g.beginPath(); g.moveTo(0,-30); g.lineTo(0,k%2?-66:-88); g.stroke(); }
  return c.toDataURL('image/png');
}
function sendIcon(){ try{ window.api.setIcon(drawIcon()); }catch{} }

// ---------- aktualizacje ----------
const UPD={s:null,cur:'',asked:''};
function updText(s){
  const v=s.version||'';
  switch(s.state){
    case 'checking': return t('Sprawdzanie…');
    case 'none': return t('Masz najnowszą wersję');
    case 'available': return t('Dostępna wersja {v}').replace('{v}',v);
    case 'downloading': return t('Pobieranie wersji {v}: {p}%').replace('{v}',v).replace('{p}',s.percent||0);
    case 'ready': return t('Wersja {v} jest gotowa do instalacji').replace('{v}',v);
    case 'error': return t('Nie udało się sprawdzić aktualizacji');
    case 'unconfigured': return t('Repozytorium aktualizacji nie jest skonfigurowane');
    case 'secondary': return t('Aktualizacjami zajmuje się pierwsza uruchomiona instancja');
    default: return t('Nie sprawdzano jeszcze aktualizacji');
  }
}
function updPaint(){
  const b=$('updbox'); if(!b) return; const s=UPD.s||{state:'idle',current:UPD.cur,packaged:true}, run=s.state==='checking'||s.state==='downloading';
  const btn=(k,l,dis)=>`<button class="gjbt" data-u="${k}"${dis?' disabled':''}>${t(l)}</button>`;
  b.innerHTML=`<div class="ur"><span>${esc(t('Wersja {v}').replace('{v}',s.current||UPD.cur||VERSION.slice(1)))}</span><b>${esc(updText(s))}</b></div>`
    +(s.state==='downloading'?`<div class="upg"><i style="width:${s.percent||0}%"></i></div>`:'')
    +(s.state==='error'&&s.err?`<p class="hint">${esc(s.err==='Brak opublikowanych wydań'?t(s.err):s.err)}</p>`:'')
    +(UPD.s&&s.packaged===false?`<p class="hint">${esc(t('Uruchomiono bez instalatora – nowe wersje pobierzesz ze strony wydania.'))}</p>`:'')
    +`<div class="ubt">${btn('chk','Sprawdź aktualizacje',run)}${s.state==='available'?(s.packaged?btn('dl','Pobierz'):btn('open','Otwórz stronę wydania')):''}${s.state==='ready'?btn('inst','Zainstaluj i uruchom ponownie'):''}</div>`;
}
function updPush(){ if(SEC||!window.api||!window.api.updSet) return; try{ window.api.updSet({auto:S.settings.upd.auto,dl:S.settings.upd.dl}); }catch{} }
async function updAsk(s){
  await new Promise(r=>setTimeout(r,600));
  if(await ask(t('Aktualizacja gotowa'),t('Wersja {v} została pobrana. Zainstalować teraz? Przeglądarka uruchomi się ponownie.').replace('{v}',s.version),t('Zainstaluj i uruchom ponownie'))) window.api.updInstall();
  else toast(t('Zostanie zainstalowana przy zamknięciu przeglądarki'));
}
function updSet(s){ if(!s) return; UPD.s=s; UPD.cur=s.current||UPD.cur; updPaint(); if(s.state==='ready'&&UPD.asked!==s.version){ UPD.asked=s.version; updAsk(s); } }
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('[data-u]'); if(!b||!$('updbox')||!$('updbox').contains(b)||!window.api) return;
  const k=b.dataset.u; try{ if(k==='chk') window.api.updCheck(); else if(k==='dl') window.api.updDownload(); else if(k==='open') window.api.updOpen(); else if(k==='inst') window.api.updInstall(); }catch{} });
if(!SEC&&window.api&&window.api.onUpd){ try{ window.api.onUpd(updSet); Promise.resolve(window.api.updInfo&&window.api.updInfo()).then(updSet).catch(()=>{}); updPush(); }catch{} }

// ---------- start ----------
try{ window.api.onXd(xdHandle); }catch{}
cw.addEventListener('dom-ready',()=>injS(cw));
try{ $('wmin').onclick=()=>window.api.winCtl('min'); $('wmax').onclick=()=>window.api.winCtl('max'); $('wcls').onclick=()=>window.api.winCtl('close');
  window.api.onWinState(v=>document.body.classList.toggle('maxd',v)); window.api.winState().then(v=>document.body.classList.toggle('maxd',v)); }catch(e){ console.warn('Zły preload.js',e); }
applySettings();
pwSet(); pushKeys();
setPanel(!!S.panel); if(S.panel) cw.setAttribute('src','https://claude.ai/new');
switchFolder(S.folders.find(f=>f.id===S.cur)?S.cur:S.folders[0].id);
renderBar(); S.aw.open.slice().forEach(id=>openApp(id));
applyLang();
bootGo();
