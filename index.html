<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob:; frame-src http: https: about: data:; base-uri 'none'; form-action 'none'"><title>Arkana Browser</title>
<link rel="stylesheet" href="css/app.css"></head><body>
<div id="boot"><canvas id="bootc"></canvas><img id="booti" alt=""><div id="bootn"><b class="serif">Arkana</b><small>BROWSER</small></div><div id="bootl"></div></div>
<script src="js/preboot.js"></script>

<div id="bar">
  <span id="brand" class="serif" title="Strona startowa"><svg class="st" viewBox="0 0 24 24"><path style="--i:0" d="M12 2.5v5"/><path style="--i:1" d="M18.7 5.3l-3.5 3.5"/><path style="--i:2" d="M21.5 12h-5"/><path style="--i:3" d="M15.2 15.2l3.5 3.5"/><path style="--i:4" d="M12 21.5v-5"/><path style="--i:5" d="M8.8 15.2l-3.5 3.5"/><path style="--i:6" d="M2.5 12h5"/><path style="--i:7" d="M5.3 5.3l3.5 3.5"/></svg><span>Arkana</span></span>
  <button id="back" class="nv" title="Wstecz"><svg viewBox="0 0 24 24"><path class="sh" d="M19 12H5"/><path class="hd" d="M11 6l-6 6 6 6"/><circle class="t1" cx="22" cy="12" r="1"/><circle class="t2" cx="25" cy="12" r=".8"/></svg></button>
  <button id="fwd" class="nv" title="Dalej"><svg viewBox="0 0 24 24"><path class="sh" d="M5 12h14"/><path class="hd" d="M13 6l6 6-6 6"/><circle class="t1" cx="2" cy="12" r="1"/><circle class="t2" cx="-1" cy="12" r=".8"/></svg></button>
  <button id="reload" class="nv" title="Odśwież"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/><circle class="cm" cx="12" cy="4" r="1.7"/></svg></button>
  <input id="url" placeholder="Zapytaj asystenta lub wpisz adres…">
  <button id="zm" title="Przywróć powiększenie 100%" style="display:none"></button>
  <div id="wc">
    <button id="wmin" title="Minimalizuj"><svg class="sv" viewBox="0 0 24 24"><path d="M6 12h12"/></svg><span class="gl">&#xE921;</span><span class="fz"><i class="sp" style="--dx:-10px;--dy:12px"></i><i class="sp" style="--dx:0px;--dy:15px"></i><i class="sp" style="--dx:10px;--dy:12px"></i><svg viewBox="0 0 24 24"><path class="ch" d="M8.5 7.5l3.5 3.5 3.5-3.5"/><path class="ln" d="M6 16.5h12"/></svg></span></button>
    <button id="wmax" title="Maksymalizuj"><svg class="sv i1" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg><svg class="sv i2" viewBox="0 0 24 24"><rect x="5" y="9" width="10" height="10" rx="2"/><path d="M9 9V7.5A1.5 1.5 0 0 1 10.5 6h6A1.5 1.5 0 0 1 18 7.5v6a1.5 1.5 0 0 1-1.5 1.5H15"/></svg><span class="gl g1">&#xE922;</span><span class="gl g2">&#xE923;</span><span class="fz"><i class="sp" style="--dx:-12px;--dy:-12px"></i><i class="sp" style="--dx:12px;--dy:-12px"></i><i class="sp" style="--dx:12px;--dy:12px"></i><i class="sp" style="--dx:-12px;--dy:12px"></i><svg viewBox="0 0 24 24"><path class="br" d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><rect class="in" x="9" y="9" width="6" height="6" rx="1.5"/></svg></span></button>
    <button id="wcls" title="Zamknij"><svg class="sv" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg><span class="gl">&#xE8BB;</span><span class="fz"><i class="sp" style="--dx:-13px;--dy:0px"></i><i class="sp" style="--dx:13px;--dy:0px"></i><i class="sp" style="--dx:0px;--dy:-13px"></i><i class="sp" style="--dx:0px;--dy:13px"></i><i class="sp" style="--dx:-9px;--dy:-9px"></i><i class="sp" style="--dx:9px;--dy:9px"></i><svg viewBox="0 0 24 24"><circle class="rg" cx="12" cy="12" r="9"/><path class="x" d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg></span></button>
  </div>
</div>
<div id="tabrow"><div id="tabs"></div><button id="nt" title="Nowa karta (Ctrl+T)">＋</button></div>
<div id="pins"><div id="pinsi"></div></div>
<div id="main">
  <div id="sidewrap"><div id="side"><div id="fl"></div><div id="sb"><div class="fd" id="gear" title="Ustawienia"><i class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></i><span>Ustawienia</span></div><div class="fd" id="clbtn" title="ChangeLog"><i class="ic"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path class="cll" d="M9 13h6M9 17h4"/></svg></i><span>ChangeLog</span></div><div class="fd" id="toggle" title="Panel asystenta"><i class="ic"><svg viewBox="0 0 24 24"><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5M5.3 5.3l3.5 3.5M15.2 15.2l3.5 3.5M18.7 5.3l-3.5 3.5M8.8 15.2l-3.5 3.5"/></svg></i><span>Panel asystenta</span></div></div></div></div>
  <div id="left">
    <div id="home">
      <div id="bgimg" class="fxl"></div><div id="bgdim" class="fxl"></div><canvas id="bg" class="fxl"></canvas>
      <div id="logo" class="serif">Arkana<span>.</span></div>
      <div id="tag">Tutaj dzieje się Magia</div>
      <input id="hs" placeholder="O co chcesz zapytać?">
      <div id="tiles">
        <div class="tile" data-u="https://pl.wikipedia.org"><i>📖</i><small>Wikipedia</small></div>
        <div class="tile" data-u="https://www.youtube.com"><i>▶️</i><small>YouTube</small></div>
        <div class="tile" data-u="https://github.com"><i>🐙</i><small>GitHub</small></div>
        <div class="tile" data-u="https://www.anthropic.com"><i>✺</i><small>Anthropic</small></div>
      </div>
      <div id="imph"><button id="imphb">Przenosisz się z innej przeglądarki? Zaimportuj dane</button><button id="imphx" title="Ukryj">×</button></div>
    </div>
  </div>
  <div id="split"></div>
  <div id="right">
    <div id="ph"><b>✺ ASYSTENT</b><span>Zaloguj się raz, naciśnij Enter, by wysłać</span><button id="close" title="Zamknij panel">×</button></div>
    <webview id="cw" src="about:blank" partition="persist:claude" allowpopups></webview>
  </div>
  <div id="rwrap"><div id="rside"><div id="rl"></div><div id="rb"><div class="fd app" id="hbtn" title="Historia"><i class="ic"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg></i><span>Historia</span></div></div></div></div>
</div>
<div id="aws"></div>
<div id="toast"></div>
<div id="kh"><div class="khi"></div></div>
<div id="set"></div>
<div id="cl"></div>
<div id="imp"></div>
<div id="pm"></div>
<div id="pwbar"></div>
<div id="fb"><input id="fbq" placeholder="Szukaj na stronie..." spellcheck="false"><span id="fbc"></span><button id="fbp" title="Poprzednie">&#x25B2;</button><button id="fbn" title="Następne">&#x25BC;</button><button id="fbx" title="Zamknij">&#xD7;</button></div>
<div id="hist"><div class="hh"><div class="hs"><i class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></i><input id="hq" placeholder="Szukaj w historii…" autocomplete="off" spellcheck="false"></div><button class="hbt" id="hclr" title="Wyczyść historię"><i class="ic"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5M14 11v5"/></svg></i></button></div><div id="hl"></div><div class="hf"><button id="hset">Ustawienia historii</button></div></div>
<div id="cm"></div>
<div id="md"><div class="card"><h3></h3><p></p><div class="btns"><button id="mc">Anuluj</button><button id="mo" class="ok">OK</button></div></div></div>
<script src="js/bundle.js"></script>
</body></html>
